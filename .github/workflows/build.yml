name: Build PvPCore

on:
  push:
    branches: [main, feature/fake-player-bot, feature/multiple-pvp-arenas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build with Gradle and Paperweight
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.8.1'
          arguments: clean build --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPCore
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
