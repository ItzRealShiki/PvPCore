name: Build CustomGuiTest

on:
  push:
    branches: [main]
    paths:
      - 'test-gui-plugin/**'
      - '.github/workflows/build-gui-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test-gui-plugin/**'
      - '.github/workflows/build-gui-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        working-directory: test-gui-plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomGuiTest
          path: test-gui-plugin/target/CustomGuiTest-*.jar
          if-no-files-found: error
          retention-days: 14
