name: MinecraftCSSEngine
version: '${project.version}'
main: de.leon.minecraftcss.MinecraftCSSEnginePlugin
api-version: '26.2'
author: ItzRealShiki
description: Standalone CSS-inspired engine for textured Paper inventory GUIs.
softdepend:
  - ItemsAdder
  - Oraxen
commands:
  mcss:
    description: Opens and manages CSS-styled Minecraft GUI menus.
    usage: /mcss [menu|open <menu>|list|reload]
permissions:
  mcss.use:
    description: Allows opening CSS Engine menus.
    default: true
  mcss.admin:
    description: Allows reloading and managing CSS Engine menus.
    default: op
    children:
      mcss.use: true
