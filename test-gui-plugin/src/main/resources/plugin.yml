name: CustomGuiTest
version: '${project.version}'
main: de.leon.customguitest.CustomGuiTestPlugin
api-version: '26.2'
author: ItzRealShiki
description: Standalone multi-screen custom GUI and UI test framework.
commands:
  test:
    description: Opens one of seven custom GUI test screens.
    usage: /test [nova|dashboard|profile|settings|showcase|stats|lab]
    aliases: [testgui]
permissions:
  customguitest.use:
    description: Allows use of the custom GUI test menu.
    default: true
