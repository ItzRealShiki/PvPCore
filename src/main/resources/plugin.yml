name: PvPCore
version: '${project.version}'
main: de.leon.pvpcore.PvPCore
api-version: '26.2'
author: Leon
description: ꜱᴛᴀɴᴅᴀʟᴏɴᴇ ᴘᴠᴘ ᴛʀᴀɪɴɪɴɢ ᴀɴᴅ ꜱᴇʀᴠᴇʀ ᴄᴏʀᴇ ᴡɪᴛʜ ɢᴜɪ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴏɴ.
commands:
  bot:
    description: ᴏᴘᴇɴꜱ ᴛʜᴇ ᴘᴠᴘ ᴛʀᴀɪɴɪɴɢ ᴍᴇɴᴜ.
    usage: /bot
    aliases: [pvp]
  rtp:
    description: ᴏᴘᴇɴꜱ ᴛʜᴇ ʀᴀɴᴅᴏᴍ ᴛᴇʟᴇᴘᴏʀᴛ ᴡᴏʀʟᴅ ꜱᴇʟᴇᴄᴛᴏʀ.
    usage: /rtp
  admin:
    description: ᴏᴘᴇɴꜱ ᴛʜᴇ ᴘᴠᴘᴄᴏʀᴇ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴏɴ ᴅᴀꜱʜʙᴏᴀʀᴅ.
    usage: /admin
  gm:
    description: ᴏᴘᴇɴꜱ ᴛʜᴇ ɢᴀᴍᴇᴍᴏᴅᴇ ᴍᴇɴᴜ ᴏʀ ᴄʜᴀɴɢᴇꜱ ᴀ ɢᴀᴍᴇᴍᴏᴅᴇ.
    usage: /gm [survival|creative|adventure|spectator] [player]
    aliases: [gamemode, gms, gmc, gma, gmsp]
permissions:
  Member.Core:
    description: ᴀᴄᴄᴇꜱꜱ ᴛᴏ ᴘᴠᴘ ᴛʀᴀɪɴɪɴɢ ᴀɴᴅ ʀᴛᴘ ꜰᴇᴀᴛᴜʀᴇꜱ.
    default: true
  Admin.Core:
    description: ᴀᴄᴄᴇꜱꜱ ᴛᴏ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴏɴ ᴀɴᴅ ᴍᴏᴅᴇʀᴀᴛɪᴏɴ ꜰᴇᴀᴛᴜʀᴇꜱ.
    default: op
  Owner.Core:
    description: ꜰᴜʟʟ ᴀᴄᴄᴇꜱꜱ ᴛᴏ ᴇᴠᴇʀʏ ᴘᴠᴘᴄᴏʀᴇ ꜰᴇᴀᴛᴜʀᴇ.
    default: op
}
