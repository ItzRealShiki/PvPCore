name: PvPCore
version: '${version}'
main: de.leon.pvpcore.PvPCore
api-version: '26.2'
author: Leon
description: ꜱᴛᴀɴᴅᴀʟᴏɴᴇ ᴘᴠᴘ ᴛʀᴀɪɴɪɴɢ ᴀɴᴅ ꜱᴇʀᴠᴇʀ ᴄᴏʀᴇ ᴡɪᴛʜ ɢᴜɪ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴏɴ.
commands:
  prac:
    description: Opens private PvP practice rooms and kit editor.
    usage: /prac [kit|join]
    aliases: [practise]
  options:
    description: Opens PvPCore visual options.
    usage: /options
  scoreboard:
    description: Customize your practice scoreboard.
    usage: /scoreboard
  spawn:
    description: Teleports you or an admin-selected player to spawn.
    usage: /spawn [player]
  setspawn:
    description: Sets the server spawn location.
    usage: /setspawn
  admin:
    description: Opens the administration dashboard.
    usage: /admin
  fight:
    description: Challenges a player to a private-box 1v1.
    usage: /fight <player|accept|deny>
    aliases: [duels]
  gm:
    description: Changes your game mode.
    usage: /gm [survival|creative|adventure|spectator] [player]
    aliases: [gamemode, gms, gmc, gma, gmsp]
  it:
    description: Edits the held item using command arguments.
    usage: /it <enchant|name|lore|hide|action>
    aliases: [itemedit]
permissions:
  Member.Core:
    description: Access to PvPCore practice rooms and kits.
    default: true
  Admin.Core:
    description: Access to administration and item editing.
    default: op
  Owner.Core:
    description: Full access to every PvPCore feature.
    default: op
