name: AIAdmin
version: '${project.version}'
main: de.leon.aiadmin.AIAdminPlugin
api-version: '26.2'
author: ItzRealShiki
description: Standalone AI administrator for Paper server diagnostics and approved repairs.
commands:
  aiadmin:
    description: Opens the AI server administrator.
    usage: /aiadmin <status|analyze|ask|logs|proposals|approve|reject|monitor|reload>
    aliases: [serverai, aia]
permissions:
  aiadmin.admin:
    description: Access to the AI administrator and its approval system.
    default: op
